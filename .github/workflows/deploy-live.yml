name: Deploy to Live

# ── Order of operations, and why it is what it is ─────────────────────────────
#
# build -> install nginx edge config -> verify the edge contract -> cut over
# dist/ -> warm artwork -> verify again.
#
# The old workflow deployed dist/ and THEN checked a server contract it never
# installed, so breakage was only ever detected once it was already live. Worse,
# nothing installed the nginx config at all: deploy/nginx/*.conf were committed
# but a human was expected to scp them and paste location blocks by hand. On
# 2026-07-25 that produced two silent production faults at once — the whole ADR
# 0013 artwork config missing (every /api/art/ request 404ing site-wide) and the
# ADR 0008 essays config never applied at all (JSON endpoints returning the SPA
# shell). Both are invisible from the outside; the client just degrades quietly.
#
# So: the server capability is installed and PROVEN before the client that
# depends on it is cut over. If the contract is not satisfied the job fails while
# the old, working dist/ is still being served.

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      # Split out of the deploy step (unchanged in substance) so that every
      # SSH-using step below shares one key + known_hosts setup instead of
      # repeating it.
      - name: Set up SSH to the droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Install SSH client (already there, but just in case)
          sudo apt-get update && sudo apt-get install -y openssh-client

          # Setup SSH directory and key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Host keys — StrictHostKeyChecking=yes below depends on these.
          cat >> ~/.ssh/known_hosts <<EOF
          161.35.188.75 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFNg0vBgfOyBg51jLBWel5DLIHktPQQ3LzUwDWpV6ZHuyV6OZpLI9XNF6kaWZzSsYrFj+b9FRw8X2jfPwASMYKU=
          161.35.188.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpQRftYhUut0aV1g+gMjMSlm+JWUdcEzhDyBj6kxQI+
          161.35.188.75 ssh-rsa 
          EOF

      # The droplet's nginx config is owned by this repo, end to end. The
      # installer is idempotent and safe to run on every deploy forever: it syncs
      # the .conf payload, rewrites only its own marker block in the vhost
      # (certbot's ssl_*/listen lines are never touched), runs `nginx -t`, and
      # restores the previous config WITHOUT reloading if that fails.
      #
      # The payload is scp'd to a run-scoped temp dir and the script itself is
      # piped over stdin, so what executes on the box is always exactly what is
      # in this commit — no stale copy of the installer can linger on the server
      # and be run by accident.
      - name: Install nginx edge config
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          PAYLOAD="/tmp/cinemaslime-edge-${GITHUB_RUN_ID}"
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "rm -rf '$PAYLOAD' && mkdir -p '$PAYLOAD'"
          # Ship the nginx configs AND the RSS freshness watchdog (script + systemd
          # units). install-edge-config.sh's ensure_watchdog looks for these in the
          # payload; a *.conf-only glob silently skips them (they are not .conf).
          scp -o StrictHostKeyChecking=yes \
            deploy/nginx/*.conf \
            deploy/nginx/rss-freshness-watchdog.sh \
            deploy/nginx/rss-freshness-watchdog.service \
            deploy/nginx/rss-freshness-watchdog.timer \
            "$DROPLET_USER@$DROPLET_HOST:$PAYLOAD/"
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "bash -s -- --payload '$PAYLOAD'" < deploy/nginx/install-edge-config.sh
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" "rm -rf '$PAYLOAD'"

      # The gate. Plain GETs against the live site asserting the server contract
      # that the about-to-ship client depends on: /api/art/ returns a real
      # downscaled image, /api/essays/* returns JSON rather than the SPA shell,
      # /api/rss proxies the feed. It runs BEFORE cutover, so a server that
      # cannot honour the contract fails the deploy while the previous dist/ is
      # still being served — which is the whole point of moving it up here.
      - name: Verify the edge contract (pre-cutover gate)
        run: npm run verify:edge

      - name: Deploy to Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          # Clear remote folder
          ssh -o StrictHostKeyChecking=yes $DROPLET_USER@$DROPLET_HOST "find /var/www/cinemaslime/html -mindepth 1 -delete"

          # Copy built files
          scp -r dist/* $DROPLET_USER@$DROPLET_HOST:/var/www/cinemaslime/html/

          # Set permissions
          ssh $DROPLET_USER@$DROPLET_HOST << 'EOF'
            find /var/www/cinemaslime/html -type f -exec chmod 644 {} \;
            find /var/www/cinemaslime/html -type d -exec chmod 755 {} \;
          EOF

          echo "Deploy complete - hard refresh your site now (Ctrl+Shift+R)"

      # nginx resizes each Episode artwork once, the first time anyone asks, then
      # serves it from disk forever after (ADR 0013). Doing that first ask here
      # means real visitors essentially never pay a resize. Plain GETs against
      # the public site — no SSH, no secrets. Fails loudly if artwork is broken.
      - name: Warm the Episode artwork cache
        run: npm run warm:artwork

      # The same check again, now against the deployed pair. The pre-cutover run
      # proved the server in isolation; this one proves server + newly deployed
      # client together. It is cheap, and it is the difference between "we think
      # it works" and "we watched it work".
      - name: Verify the edge contract (post-deploy)
        run: npm run verify:edge
