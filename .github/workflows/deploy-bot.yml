name: Deploy the Curator bot

# Builds the Cinema Slime Curator (ADR 0021) into one bundle and installs it on
# the droplet as a systemd service, with a pinned Node, its unit, its config,
# the vault seed, and its two credentials. The droplet never runs npm or holds a
# checkout: it runs exactly the file this job built and tested.
#
# Secrets reach the droplet only over SSH stdin, never on a command line:
#   BRAND_SECRET_KEY   scripts/setup-curation-key.sh sets it
#   DISCORD_BOT_TOKEN  scripts/setup-discord-bot.sh sets it
#   CSPOD_INTAKE_SECRET  optional (ADR 0023): the cs-pod-editor's intake secret;
#                        when unset, the droplet keeps the copy it has

on:
  push:
    branches:
      - live
    paths:
      - 'bot/**'
      - 'deploy/bot/**'
      - 'src/**'
      - 'vault/essays/**'
      - 'vite.bot.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

concurrency:
  group: droplet-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the bot bundle
        run: npm run build:bot

      - name: Smoke-test the bundle
        run: node dist-bot/cinemaslime-bot.mjs --help

      - name: Require the bot's secrets
        env:
          BRAND_SECRET_KEY: ${{ secrets.BRAND_SECRET_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          [ -n "$BRAND_SECRET_KEY" ] || { echo "::error::BRAND_SECRET_KEY is not set; run scripts/setup-curation-key.sh"; exit 1; }
          [ -n "$DISCORD_BOT_TOKEN" ] || { echo "::error::DISCORD_BOT_TOKEN is not set; run scripts/setup-discord-bot.sh"; exit 1; }

      - name: Set up SSH to the droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Host keys — same as deploy-live.yml; StrictHostKeyChecking=yes depends on these.
          cat >> ~/.ssh/known_hosts <<EOF
          161.35.188.75 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFNg0vBgfOyBg51jLBWel5DLIHktPQQ3LzUwDWpV6ZHuyV6OZpLI9XNF6kaWZzSsYrFj+b9FRw8X2jfPwASMYKU=
          161.35.188.75 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpQRftYhUut0aV1g+gMjMSlm+JWUdcEzhDyBj6kxQI+
          161.35.188.75 ssh-rsa 
          EOF

      # Each secret is piped from this job's environment into `install` reading
      # /dev/stdin on the droplet: printf is a shell builtin, so the value is on
      # no process's argv on either side. The installer moves the .new file into
      # place and restarts the bot only if it changed.
      - name: Ship the credentials
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          BRAND_SECRET_KEY: ${{ secrets.BRAND_SECRET_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CSPOD_INTAKE_SECRET: ${{ secrets.CSPOD_INTAKE_SECRET }}
        run: |
          DIR=/etc/cinemaslime-bot/credentials
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" "install -d -m 0700 $DIR"
          printf '%s' "$BRAND_SECRET_KEY" | ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "install -m 0600 /dev/stdin $DIR/brand-secret-key.new"
          printf '%s' "$DISCORD_BOT_TOKEN" | ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "install -m 0600 /dev/stdin $DIR/discord-token.new"
          if [ -n "$CSPOD_INTAKE_SECRET" ]; then
            printf '%s' "$CSPOD_INTAKE_SECRET" | ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
              "install -m 0600 /dev/stdin $DIR/cspod-intake-secret.new"
          fi

      # Same shape as the nginx installer in deploy-live.yml: the payload is
      # scp'd to a run-scoped temp dir and the installer is piped over stdin, so
      # what runs on the box is exactly this commit.
      - name: Install the bot
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          PAYLOAD="/tmp/cinemaslime-bot-${GITHUB_RUN_ID}"
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "rm -rf '$PAYLOAD' && mkdir -p '$PAYLOAD/vault'"
          scp -o StrictHostKeyChecking=yes \
            dist-bot/cinemaslime-bot.mjs \
            deploy/bot/cinemaslime-bot.service \
            deploy/bot/cinemaslime-bot \
            deploy/bot/config.json \
            deploy/bot/node.sha256 \
            "$DROPLET_USER@$DROPLET_HOST:$PAYLOAD/"
          scp -o StrictHostKeyChecking=yes vault/essays/*.json "$DROPLET_USER@$DROPLET_HOST:$PAYLOAD/vault/"
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "bash -s -- --payload '$PAYLOAD'" < deploy/bot/install-bot.sh
          ssh -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" "rm -rf '$PAYLOAD'"
