# Cinema Slime — Episode artwork derivative cache zone + resize server (http context).
#
# Install as: /etc/nginx/conf.d/cinemaslime-art-cache.conf
# (nginx.conf already includes conf.d/*.conf inside the http{} block, which is
# the only context where proxy_cache_path and server{} are valid.)
#
# Pairs with the location blocks in cinemaslime-art-location.conf.
# See docs/deploy/nginx-artwork-proxy.md for the full installation playbook.
# Implements ADR 0013 — same-origin downscaled Episode artwork.
#
# Requires the GD-backed image-filter module:
#   apt install libnginx-mod-http-image-filter
# The package drops its own `load_module` line into /etc/nginx/modules-enabled/,
# which nginx.conf includes from the main context — no hand-editing needed.

# ── The derivative cache ──────────────────────────────────────────────────────
#
# What lands here is the ALREADY-RESIZED output of the loopback server below, not
# the CloudFront original — that is the whole point of the two-tier structure
# (see the location file and the playbook for why a single location would cache
# the wrong bytes AND re-resize on every hit).
#
# keys_zone=1m  — nginx documents ~8,000 keys per MB; we need ~210 today
#                 (70 artworks x 3 widths), so this is years of headroom.
# max_size=1g   — a hard bound so a growing catalogue can never fill the disk.
# inactive=365d — DELIBERATE. The usual short `inactive` window evicts idle
#                 entries, but a rarely-requested older Episode's artwork is
#                 exactly the long-tail asset this feature exists to keep cheap.
#                 With a year-long window, eviction only ever happens under real
#                 max_size pressure (LRU), never merely for going quiet — which
#                 is also what removes any need for a scheduled re-warm job.
proxy_cache_path /var/cache/nginx/art
    levels=1:2
    keys_zone=art_cache:1m
    max_size=1g
    inactive=365d
    use_temp_path=off;

# ── Tier 3: the resize server, loopback-only ──────────────────────────────────
#
# This is the tier that actually fetches from CloudFront and runs the GD resize.
# It listens on 127.0.0.1 only, so it is unreachable from the internet; the
# public tier talks to it over the loopback interface like any other upstream
# (an `internal;` location cannot be used here — `internal` only blocks external
# *client* requests, and a loopback proxy_pass IS an external request).
server {
    listen 127.0.0.1:8081;
    server_name _;

    # Belt and braces on top of the loopback-only listen.
    allow 127.0.0.1;
    deny all;

    # This tier is an implementation detail; the public tier logs the real hits.
    access_log off;

    # Capture and re-validate the width here too, then hand off to a plain prefix
    # location: nginx forbids a location-relative URI suffix on proxy_pass inside
    # a regex location, so the capture step and the fetch step must be separate
    # blocks joined by an internal rewrite.
    location ~ ^/_art_resize/(?<rz_width>160|320|640)/(?<rz_path>.+)$ {
        rewrite ^ /_art_origin/$rz_path last;
    }

    # Anything that reached this server without a valid width is a bug in the
    # public tier, not something to resize.
    location /_art_resize/ {
        return 404;
    }

    location /_art_origin/ {
        internal;

        # The upstream host is HARDCODED and never taken from the request. This
        # is what keeps /api/art/ from being usable as an open image proxy.
        # The literal trailing slash makes nginx strip /_art_origin/ and forward
        # the remaining CloudFront path unchanged.
        proxy_pass https://d3t3ozftmdmh3i.cloudfront.net/;
        proxy_set_header Host d3t3ozftmdmh3i.cloudfront.net;
        proxy_ssl_server_name on;

        # Nothing about the visitor is forwarded to CloudFront.
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "cinemaslime-nginx";

        # Sources are ~2.2 MB 3000x3000 JPEGs; the 1M default would reject them
        # outright with 415. 6M is comfortable headroom over the real files.
        # Note the GD-side cost this implies: a 3000x3000 truecolor decode is
        # ~34 MB of bitmap per in-flight resize, before the resized copy.
        image_filter_buffer 6M;

        # Proportional downscale to the requested width; "-" leaves the height
        # to follow the aspect ratio. Values may contain variables (nginx docs).
        image_filter resize $rz_width -;
        image_filter_jpeg_quality 82;
        # GD resizes with gdImageCopyResampled, which is soft; this is the
        # documented mitigation.
        image_filter_sharpen 20;

        # NO `error_page 415` fallback to the original. A resize failure must
        # fail loudly rather than quietly serving the 2.2 MB original — that
        # fallback would silently reintroduce the exact defect this exists to
        # fix. The client already degrades to its dark placeholder.
    }
}
