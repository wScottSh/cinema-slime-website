# Cinema Slime — newsletter signup rate limit (http context).
#
# INSTALLED BY CI as /etc/nginx/conf.d/cinemaslime-newsletter-cache.conf by
# deploy/nginx/install-edge-config.sh. Do not scp it by hand. It holds no cache;
# the name ends in -cache.conf only because that is how the installer knows a
# file belongs in http{} context, the only place limit_req_zone is valid.
#
# Pairs with cinemaslime-newsletter-location.conf. See
# docs/deploy/nginx-newsletter-proxy.md and ADR 0024.
#
# Anyone can post anyone's address, and every accepted post spends one of the
# free plan's subscriber slots, so the signup is throttled per client. 4 a
# minute with a burst of 4 lets a person fix a typo and retry several times; a
# script gets one signup every 15 seconds per client it can be. The status (429)
# is set in the location, not here: limit_req_status in http{} would change the
# answer of every other limit_req on the box.
#
# A client is an IPv4 address, or an IPv6 /64. One subscriber line is routinely
# handed a whole /64, so keying on the full address would let one machine
# rotate through 2^64 of them. The map matches the 16 raw bytes of an IPv6
# address and keeps the first 8. An IPv4-mapped address (::ffff:a.b.c.d) is
# excluded and keyed whole: its first 8 bytes are zero for every IPv4 address
# there is. IPv4 is 4 bytes and never matches.
#
# There is deliberately no ceiling across all clients: one script could spend
# it and lock out every real visitor. ADR 0024 records the tradeoff.
map $binary_remote_addr $newsletter_client {
    "~(?s)\A(?!\x00{10}\xff\xff)(?<newsletter_ipv6_net>.{8}).{8}\z" $newsletter_ipv6_net;
    default $binary_remote_addr;
}
limit_req_zone $newsletter_client zone=newsletter:1m rate=4r/m;
