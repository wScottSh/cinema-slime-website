# Cinema Slime — newsletter signup rate limit (http context).
#
# INSTALLED BY CI as /etc/nginx/conf.d/cinemaslime-newsletter-cache.conf by
# deploy/nginx/install-edge-config.sh. Do not scp it by hand. It holds no cache;
# the name ends in -cache.conf only because that is how the installer knows a
# file belongs in http{} context, the only place limit_req_zone is valid.
#
# Pairs with cinemaslime-newsletter-location.conf. See
# docs/deploy/nginx-newsletter-proxy.md and ADR 0024.
#
# Anyone can post anyone's address, and every accepted post spends one of the
# free plan's subscriber slots, so the signup is throttled per client address.
# 4 a minute with a burst of 4 lets a person fix a typo and retry several times;
# a script gets one signup every 15 seconds per address it holds. The status
# (429) is set in the location, not here: limit_req_status in http{} would
# change the answer of every other limit_req on the box.
limit_req_zone $binary_remote_addr zone=newsletter:1m rate=4r/m;
