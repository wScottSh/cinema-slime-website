# Cinema Slime — Link Preview pages for Episode and Essay Pages (server context).
#
# INSTALLED BY CI. deploy/nginx/install-edge-config.sh copies this file to
# /etc/nginx/snippets/ and includes it from the CI-managed marker block in the
# HTTPS `server { ... }` for cinemaslime.com. Do not paste it by hand.
#
# scripts/render-share-pages.mjs writes one copy of index.html per page, carrying
# that page's own <title>, Open Graph and Twitter Card tags (ADR 0020):
#
#   /var/www/cinemaslime/html/episode/<guid>/index.html
#   /var/www/cinemaslime/html/essay/<slug-or-coordinate>/index.html
#
# Link unfurlers (Discord, Slack, iMessage…) never run JavaScript, so this file
# is the only thing they ever see of the page.
#
# Why this block exists: the SPA fallback `try_files $uri $uri/ /index.html`
# would find the directory and answer 301 -> /episode/<guid>/ (verified against
# nginx:stable). A redirect on every shared link is wasted round-trip and a
# trailing-slash URL the client then has to undo. Naming the file directly
# serves it with a 200 at the canonical, slash-less URL.
#
# A page with no file yet (an Episode published since the last render) falls
# through to the site-wide index.html — the page still works, it just unfurls
# with the site-wide preview until the next scheduled render.
#
# $uri is the decoded path, so /essay/30023%3A… and /essay/30023:… both match the
# coordinate directory. A regex location outranks the prefix `location /`, and
# the managed include block sits before it, so this also wins over the static
# asset regex further down the vhost.

location ~ ^/(episode|essay)/[^/]+$ {
    root /var/www/cinemaslime/html;
    try_files $uri/index.html /index.html;
}
