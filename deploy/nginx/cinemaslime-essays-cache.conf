# Cinema Slime — Essays reverse-proxy cache zone (http context).
#
# INSTALLED BY CI as /etc/nginx/conf.d/cinemaslime-essays-cache.conf by
# deploy/nginx/install-edge-config.sh, which also creates the cache directory
# named in proxy_cache_path below. Do not scp it by hand.
#
# NOTE: until 2026-07-25 this file existed in the repo but had NEVER been applied
# to the box, so /api/essays/* returned the SPA shell and the ADR 0008 snapshot
# never actually worked in production. That is the failure the CI installer and
# the edge-contract verifier exist to make impossible.
# (nginx.conf already includes conf.d/*.conf inside the http{} block, which is
# the only context where proxy_cache_path is valid.)
#
# Pairs with the location blocks in cinemaslime-essays-location.conf.
# See docs/deploy/nginx-essays-proxy.md for the full installation playbook.
# Implements ADR 0008 — the same-origin, edge-cached Essays snapshot that amends
# ADR 0006 decision #6 ("Nostr stays client-side").

proxy_cache_path /var/cache/nginx/essays
    levels=1:2
    keys_zone=essays_cache:1m
    max_size=10m
    inactive=60m
    use_temp_path=off;
