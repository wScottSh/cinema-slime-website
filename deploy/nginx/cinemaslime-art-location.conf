# Cinema Slime — Episode artwork derivative locations (server context).
#
# Paste all three blocks inside the HTTPS `server { ... }` for cinemaslime.com in
# /etc/nginx/sites-available/cinemaslime.com (alongside `location / { ... }`).
# Requires the art_cache zone and the 127.0.0.1:8081 resize server from
# cinemaslime-art-cache.conf.
#
# The browser asks for /api/art/{width}/{cloudfront-path} and gets back a
# downscaled copy of the Episode artwork instead of the 3000x3000, ~2.2 MB
# original. See docs/deploy/nginx-artwork-proxy.md. Implements ADR 0013.
#
# ── Why three blocks and not one ──────────────────────────────────────────────
# nginx writes a proxied response to its cache store BEFORE the body-filter chain
# runs, and re-sends cached responses back THROUGH that same chain on every hit.
# image_filter is a body filter. So a single location doing proxy_pass +
# image_filter + proxy_cache would cache the ORIGINAL full-size bytes and re-pay
# the GD resize on every request, hit or miss — the exact opposite of what we
# want. Hence: the resize happens on a loopback server (tier 3, in the cache
# file), and the cache sits in front of THAT, so what gets stored is the already
# resized output and the resize runs at most once per (width, path).
#
# ── When the width ladder changes ─────────────────────────────────────────────
# The widths below are the real security boundary — they are what decides whether
# any resize work happens at all. Keep them in sync with ARTWORK_WIDTHS in
# src/artwork-url.js and with the regex in the tier-3 server.
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Public: capture, validate the width, dispatch. No proxying here. ───────
location ~ ^/api/art/(?<art_width>[0-9]+)/(?<art_path>.+)$ {
    # A width off the ladder is refused outright and never reaches a resize.
    # This is the boundary that prevents unbounded resize requests at arbitrary
    # sizes — it is not an optimization.
    if ($art_width !~ ^(160|320|640)$) {
        return 404;
    }
    rewrite ^ /_art/$art_width/$art_path last;
}

# Malformed artwork requests (no width segment, non-numeric width, no path).
# A plain prefix location, NOT `^~`: regex locations are still tested first, so
# the block above keeps winning for well-formed requests. Without this, the SPA's
# `location /` catch-all would answer an image request with index.html.
location /api/art/ {
    return 404;
}

# ── 2. Internal: the cache tier. Proxies to the loopback resize server. ───────
location /_art/ {
    internal;

    # Literal proxy_pass with a URI: nginx strips /_art/ and appends the rest,
    # so /_art/160/staging/x.jpg becomes /_art_resize/160/staging/x.jpg on the
    # loopback server.
    proxy_pass http://127.0.0.1:8081/_art_resize/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache art_cache;
    # Keyed on exactly (width, path) — deliberately not $request_uri, so a query
    # string cannot mint unlimited distinct cache entries for the same image.
    proxy_cache_key "cinemaslime-art|$art_width|$art_path";
    proxy_cache_valid 200 30d;
    # Don't let a failed or unsupported source hammer CloudFront, but don't let
    # it stick around either.
    proxy_cache_valid 404 415 1m;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # CloudFront's own Cache-Control must not drive our freshness window, and
    # must not reach the browser either — the header below is the only one the
    # browser sees.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;

    # Safe to promise a year: origin filenames are unique per upload and never
    # change in place, so a given {width}/{path} can never legitimately change
    # content under a long-lived browser cache entry.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Surfaced for smoke-testing: MISS on the first request, HIT thereafter.
    add_header X-Cache-Status $upstream_cache_status always;
}
