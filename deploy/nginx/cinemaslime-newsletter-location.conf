# Cinema Slime — newsletter signup (server context).
#
# INSTALLED BY CI. deploy/nginx/install-edge-config.sh copies this file to
# /etc/nginx/snippets/ and includes it from the CI-managed marker block in the
# HTTPS `server { ... }` for cinemaslime.com. Do not paste it by hand.
# Requires the `newsletter` limit_req zone from cinemaslime-newsletter-cache.conf
# and the root-only secret include written by the deploy (see below).
# Implements ADR 0024; playbook in docs/deploy/nginx-newsletter-proxy.md.
#
# The wire contract the browser sees:
#
#   POST /api/newsletter, empty body, address in X-Newsletter-Email
#   204  subscribed            422  missing or malformed address
#   405  any other method      429  rate limited
#   5xx  anything else, including every Sender failure
#
# ── Why the address travels in a header ──────────────────────────────────────
# nginx cannot read a request body before it proxies, so a body could not be
# validated here. A header can, in the rewrite phase, before anything is sent
# upstream. The default access log format records the request line, referer and
# user agent, none of which carry the address.
#
# ── Why the upstream call is an auth_request subrequest ──────────────────────
# Sender answers a signup with the full stored subscriber record, and anyone can
# post anyone's address, so no byte of Sender's response may reach the browser.
# A plain proxy_pass would stream it through. An auth_request subrequest runs
# the proxied call and keeps only its status: 2xx lets the request continue,
# 401/403 come back as that status, anything else as 500. Its body is discarded.
#
# The public location then has to answer 204 itself, AFTER the access phase.
# `return` cannot do it: it runs in the rewrite phase, before auth_request, so a
# bare `return 204` here would answer without ever calling Sender. try_files
# runs after the access phase, finds no file, and hands the request to
# @newsletter_subscribed, whose `return 204` is the answer.
#
# ── Where the secret lives ───────────────────────────────────────────────────
# /etc/nginx/cinemaslime-secrets/sender.conf (dir 0700, file 0600, root-owned)
# sets $sender_token and $sender_group. It is written by deploy-live.yml from
# the SENDER_API_TOKEN and SENDER_GROUP_ID repo secrets, rendered through
# deploy/nginx/render-sender-secret.sh, which refuses any value that could
# inject a directive. It lives outside conf.d/ and snippets/ on purpose: the
# installer reaps every cinemaslime-*.conf there that the repo does not ship.
# nginx reads it as root at load time, so the workers never need access.
#
# The site must start without it. Each location that reads the secrets first
# sets both to "", then includes the file through a glob (`sender.con[f]`
# matches exactly sender.conf): a glob that matches nothing is not an error, a
# plain path is. So a missing or empty file leaves the token empty, and the
# signup answers 503 while the rest of the site serves. A truncated file still
# fails to parse, which is why the deploy writes it to a temp name and renames
# it into place only once it is complete.

location = /api/newsletter {
    if ($request_method != POST) {
        add_header Allow "POST" always;
        return 405;
    }

    # The address is pasted into a JSON string below, so the alphabet is what
    # stops injection: no quote, backslash, control character or space can
    # pass, and the lookahead caps the length at 254. The rest refuses what
    # Sender would, so a typo reads as 422, not as a Sender failure: the local
    # part and each domain label start and end alphanumeric, the local part
    # has no "..", and the last label is at least two letters. It anchors
    # with \A and \z because PCRE's ^ and $ allow a trailing newline.
    # src/newsletter.js holds the same pattern with ^ and $, which in
    # JavaScript are exact; src/newsletter.test.js fails if the two differ in
    # anything else.
    if ($http_x_newsletter_email !~ "\A(?=.{1,254}\z)(?![^@]*\.\.)[A-Za-z0-9](?:[A-Za-z0-9._+'-]{0,62}[A-Za-z0-9])?@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}\z") {
        return 422;
    }

    set $sender_token "";
    set $sender_group "";
    include /etc/nginx/cinemaslime-secrets/sender.con[f];
    if ($sender_token = "") {
        return 503;
    }

    limit_req zone=newsletter burst=4 nodelay;
    limit_req_status 429;

    auth_request /_newsletter/subscribe;

    # auth_request turns every Sender failure, timeout or failed certificate
    # check into 500 (Sender's 401 and 403 are turned into 502 before they get
    # here; see the subrequest). The browser gets a plain 502 for all of them.
    error_page 500 =502 @newsletter_failed;

    try_files /.newsletter-never-a-file @newsletter_subscribed;
}

location @newsletter_subscribed {
    return 204;
}

location @newsletter_failed {
    return 502;
}

location = /_newsletter/subscribe {
    internal;
    set $sender_token "";
    set $sender_group "";
    include /etc/nginx/cinemaslime-secrets/sender.con[f];

    # Resolved per request, never at boot, for the reason given at length in
    # cinemaslime-rss-location.conf (ADR 0014): a failed lookup must fail one
    # signup, not stop nginx from starting. Location-scoped for the same
    # duplicate-resolver reason as the other snippets.
    resolver 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 3s;
    set $sender_upstream api.sender.net;
    proxy_pass https://$sender_upstream/v2/subscribers;

    # This request carries a full-account token, so unlike the read-only
    # proxies it verifies who it is talking to. The default verify depth of 1
    # allows a single intermediate; 3 leaves room for a CA that issues through
    # two, or cross-signs, without the signup going dark.
    proxy_ssl_server_name on;
    proxy_ssl_name api.sender.net;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Nothing from the visitor's request is forwarded: not their cookies, not
    # their IP, not the body. nginx writes the whole upstream request.
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_set_header Host api.sender.net;
    proxy_set_header Authorization "Bearer $sender_token";
    proxy_set_header Content-Type "application/json";
    proxy_set_header Accept "application/json";
    proxy_set_body '{"email":"$http_x_newsletter_email","groups":["$sender_group"]}';

    # auth_request passes a 401 or 403 through to the browser as itself, with
    # Sender's WWW-Authenticate header copied on. Both only mean our token is
    # wrong, so they are caught here and become a 502 like any other failure.
    proxy_intercept_errors on;
    error_page 401 403 =502 @newsletter_failed;

    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}
