# Cinema Slime — RSS reverse-proxy location (server context).
#
# INSTALLED BY CI. deploy/nginx/install-edge-config.sh copies this file to
# /etc/nginx/snippets/ and includes it from the CI-managed marker block in the
# HTTPS `server { ... }` for cinemaslime.com. Do not paste it by hand.
# Requires the rss_cache zone from cinemaslime-rss-cache.conf.
#
# This block used to live INLINE in the vhost, pasted there by hand. The
# installer's first run removes that inline copy as it adds the include —
# otherwise nginx refuses to start with "duplicate location".
#
# `location = /api/rss` is an exact match, the highest-priority form in nginx's
# location-selection order, so unlike the artwork blocks it needs no `^~` and is
# immune to the static-asset regex location further down the vhost.
#
# The browser fetches this same-origin path instead of racing public CORS
# proxies; nginx proxies to the Anchor feed, caches the response for ~5 min,
# and serves the last-good copy when Anchor is slow or down.

location = /api/rss {
    # ── Why the anchor.fm upstream is resolved per-request, not at boot ──────
    # nginx resolves the hostname in a LITERAL proxy_pass at config-load time,
    # so one failed DNS lookup for anchor.fm at boot/reload makes nginx
    # `[emerg]` and refuse to start — taking every unrelated site on the box
    # down with it. That is exactly the class of outage fixed for the artwork
    # upstream on 2026-07-29 (ADR 0014, "a third-party gateway is never
    # load-bearing"; see cinemaslime-art-cache.conf and
    # docs/deploy/nginx-artwork-proxy.md for the full story). Building
    # proxy_pass from a variable defers the lookup to request time via the
    # resolver below, so an unreachable anchor.fm can only ever fail an
    # individual request — which already degrades via proxy_cache_use_stale —
    # and can never stop nginx from starting.
    #
    # The resolver lives INSIDE this location, not at server/snippet scope:
    # this snippet is `include`d at server context, and the essays snippet
    # (cinemaslime-essays-location.conf) also needs its own resolver — two
    # server-scope `resolver` directives in the same context is a "duplicate
    # resolver" config error nginx refuses to start on. Location-scope
    # resolvers are independent of each other, so this is the safe placement.
    # 127.0.0.53 is the systemd-resolved stub the rest of the box already uses;
    # ipv6=off skips a pointless AAAA lookup anchor.fm answers over v4 anyway.
    resolver 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 3s;
    set $rss_upstream anchor.fm;

    # ── Option C — cache-bust the UPSTREAM url (staleness research §5) ───────
    # Fastly's default cache key includes the query string, so a value that
    # changes on every request (nginx's $msec, seconds.milliseconds since the
    # epoch) is a guaranteed MISS at Fastly, forcing a fetch from Anchor's true
    # origin on every one of OUR requests. This does not defeat our own cache:
    # our proxy_cache_valid 200 5m below still governs how often we make this
    # request at all, so upstream load stays bounded at ~288/day (one per 5-min
    # TTL refresh), not one per visitor. See docs/deploy/rss-accept-encoding-
    # staleness-research.md §5 and §6 (Option C) for the full reasoning,
    # including why this is an escalation paired with Option A rather than a
    # standalone fix: Option A alone only guarantees CONSISTENCY across
    # encodings, not freshness of the one Fastly variant we consistently land
    # on, and this closes that remaining gap.
    proxy_pass https://$rss_upstream/s/1050fb0e4/podcast/rss?_=$msec;

    # ── Option A — normalize the outbound Accept-Encoding (staleness research
    #    §2, §6) ────────────────────────────────────────────────────────────
    # THE bug: Fastly (fronting anchor.fm) caches a separate variant per
    # Vary-nominated request header, including Accept-Encoding, under a ~7-day
    # s-maxage, and does not purge every variant on publish. We were forwarding
    # the client's own Accept-Encoding upstream, so different browsers (whose
    # Accept-Encoding strings differ — "gzip" vs. "gzip, deflate, br, zstd")
    # landed on different, independently-stale Fastly variants of the SAME
    # feed. Setting this to the empty string is nginx's own documented
    # "removing a header field" pattern: every request we make to Anchor now
    # carries the same (absent) Accept-Encoding, so Fastly can only ever hand
    # us one variant lineage — collapsing the fragmentation at its source
    # rather than working around it on our side.
    proxy_set_header Accept-Encoding "";

    # SNI + correct vhost for Anchor's Fastly edge. Still HARDCODED, never
    # request-derived — $rss_upstream is a literal `set` above, not anything
    # taken from the client, which is what keeps this from becoming an open
    # proxy; only per-request DNS timing changed.
    proxy_set_header Host $rss_upstream;
    proxy_ssl_server_name on;

    # Anchor sends Cache-Control: s-maxage=604834 (~7 days). Ignore it so our
    # own short TTL governs freshness against the 5–10 min staleness budget
    # (ADR 0006).
    #
    # Vary is ignored too — this is staleness research §6 Option B, and it is
    # NOT the no-op it first looks like. Fastly's response carries `Vary:
    # Accept-Encoding` as a property of the resource, present regardless of what
    # we requested. So even with Option A normalizing what we SEND upstream,
    # nginx's own Vary handling would still key rss_cache off the CLIENT's
    # original Accept-Encoding (research §1) — proxy_set_header only rewrites the
    # outbound request, it does not touch the header table Vary-matching reads.
    # That would fragment our cache into one lineage per distinct browser
    # encoding string ("gzip" vs. "gzip, deflate, br, zstd" vs. …) and multiply
    # the Option C origin refreshes by that count. Ignoring Vary collapses
    # rss_cache back to a single lineage, which is what actually makes the
    # "~288/day" bound above true and completes Option A's guarantee on our side
    # of the wire.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

    # Defensive/explicit: this is nginx's own default proxy_cache_key, spelled
    # out so it is unmistakable that the Option C $msec buster above lives
    # ONLY in the upstream request URL and deliberately does NOT appear here.
    # Our own cache entry for a client's `/api/rss` request is still keyed on
    # the plain, unbusted request — visitors keep getting cache HITs against
    # each other exactly as before; only OUR periodic refresh of that cache
    # entry is forced to bypass Fastly.
    proxy_cache_key $scheme$proxy_host$request_uri;

    proxy_cache rss_cache;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_background_update on;

    # Keep serving the last good copy when upstream is flaky or down.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Same-origin now, but keep CORS open and avoid a duplicate header from
    # upstream (Anchor already sends Access-Control-Allow-Origin: *).
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;

    # Surfaced for smoke-testing: MISS, then HIT, then STALE when upstream dies.
    add_header X-Cache-Status $upstream_cache_status always;

    # ── Restore client-facing compression (the bandwidth half of Option A) ───
    # Option A above asks Anchor for an uncompressed body, so what we now cache
    # and would otherwise proxy straight through is identity-encoded — bigger
    # over the wire to every browser than before. This is nginx compressing OUR
    # response to the CLIENT, an entirely separate axis from what we requested
    # from upstream (staleness research §2), so it is orthogonal to the fix
    # itself and only here to not regress bandwidth.
    gzip on;
    # nginx's default gzip_types is only text/html; without naming the feed's
    # actual content-types here, an RSS/XML response would never compress.
    gzip_types application/rss+xml application/xml text/xml;
    # nginx does NOT gzip a proxied response by default (it treats "came from
    # a proxy" as a reason to be cautious) — `any` says our own /api/rss
    # response, whatever request headers reached us, is always eligible.
    gzip_proxied any;
}
